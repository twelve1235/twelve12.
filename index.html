    <style>
        :root {
            --bg-0: oklch(0.15 0.006 258);
            --bg-1: oklch(0.19 0.008 258);
            --bg-2: oklch(0.25 0.012 255);

            --surface: oklch(0.24 0.010 258 / 0.55);
            --surface-solid: oklch(0.26 0.010 258);
            --surface-hover: oklch(0.32 0.012 255);

            --border: oklch(0.80 0.02 250 / 0.12);
            --border-strong: oklch(0.85 0.03 240 / 0.34);

            --text: oklch(0.95 0.004 258);
            --text-dim: oklch(0.75 0.008 258);
            --text-faint: oklch(0.60 0.008 258);

            --accent: oklch(0.83 0.075 228);
            --accent-dim: oklch(0.83 0.075 228 / 0.16);
            --online: oklch(0.80 0.15 150);

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: var(--bg-0);
        }

        body {
            font-family: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
            color: var(--text);
            background:
                radial-gradient(120% 80% at 85% 0%, oklch(0.28 0.02 250 / 0.55), transparent 60%),
                linear-gradient(155deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
            background-attachment: fixed;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(18px, 4vw, 30px);
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .ltr { direction: ltr; unicode-bidi: isolate; }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            top: -8%;
            color: oklch(0.9 0.02 240);
            opacity: 0;
            will-change: transform, opacity;
            animation: fall linear infinite;
            filter: drop-shadow(0 0 4px oklch(0.9 0.05 235 / 0.35));
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg);   opacity: 0; }
            12%  { opacity: 0.55; }
            88%  { opacity: 0.55; }
            100% { transform: translateY(112vh) rotate(300deg); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(100%, 500px);
            padding: clamp(30px, 6vw, 46px) clamp(24px, 5vw, 38px);
            text-align: center;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            -webkit-backdrop-filter: blur(22px) saturate(1.2);
            backdrop-filter: blur(22px) saturate(1.2);
            box-shadow:
                0 1px 0 oklch(1 0 0 / 0.06) inset,
                0 24px 60px oklch(0 0 0 / 0.45);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(220px 220px at var(--mx, 50%) var(--my, 0%),
                    var(--accent-dim), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s var(--ease);
            pointer-events: none;
        }

        .card:hover::before { opacity: 1; }

        .avatar {
            position: relative;
            width: clamp(104px, 28vw, 132px);
            aspect-ratio: 1;
            margin: 0 auto 18px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-strong);
            box-shadow: 0 10px 30px oklch(0 0 0 / 0.4);
            transition: transform 0.4s var(--ease);
        }

        .avatar:hover img { transform: scale(1.04); }

        .avatar .status {
            position: absolute;
            inset-inline-end: 6px;
            inset-block-end: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--online);
            border: 3px solid var(--bg-1);
            box-shadow: 0 0 0 0 oklch(0.8 0.15 150 / 0.5);
            animation: pulse 2.4s var(--ease) infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 oklch(0.8 0.15 150 / 0.5); }
            70%  { box-shadow: 0 0 0 8px oklch(0.8 0.15 150 / 0); }
            100% { box-shadow: 0 0 0 0 oklch(0.8 0.15 150 / 0); }
        }

        .name {
            font-family: 'Space Grotesk', 'IBM Plex Sans Arabic', sans-serif;
            font-size: clamp(2.05rem, 8vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .handle {
            margin-top: 6px;
            font-size: 0.98rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        .signature {
            margin-top: 10px;
            font-family: 'Great Vibes', cursive;
            font-weight: 400;
            font-size: clamp(2.2rem, 9vw, 2.9rem);
            line-height: 1;
            color: var(--text);
            text-shadow: 0 2px 16px oklch(0.83 0.075 228 / 0.28);
        }

        .bio {
            margin: 20px auto 0;
            max-width: 42ch;
            line-height: 1.85;
            font-size: 0.96rem;
            font-weight: 300;
            color: var(--text-dim);
        }

        .socials ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: clamp(8px, 2.2vw, 12px);
            margin-top: 28px;
        }

        .social {
            position: relative;
            display: grid;
            place-items: center;
            aspect-ratio: 1;
            border-radius: 15px;
            color: var(--text-dim);
            background: var(--surface-solid);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.35s var(--ease), background 0.3s var(--ease),
                border-color 0.3s var(--ease), color 0.3s var(--ease);
        }

        .social svg {
            width: 42%;
            height: 42%;
            position: relative;
            z-index: 1;
        }

        .social::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-120%);
            background: linear-gradient(105deg, transparent 40%, oklch(0.95 0.02 240 / 0.14) 50%, transparent 60%);
            transition: transform 0.6s var(--ease);
        }

        .social:hover,
        .social:focus-visible {
            transform: translateY(-4px);
            color: var(--text);
            background: var(--surface-hover);
            border-color: var(--border-strong);
            outline: none;
        }

        .social:hover::after,
        .social:focus-visible::after { transform: translateX(120%); }

        .social:active { transform: translateY(-1px) scale(0.97); }

        .contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
        }

        .email {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.25s var(--ease);
            word-break: break-all;
        }

        .email:hover { color: var(--text); }
        .email svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }

        .copy {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: transparent;
            color: var(--text-faint);
            cursor: pointer;
            transition: all 0.25s var(--ease);
        }

        .copy:hover,
        .copy:focus-visible {
            color: var(--accent);
            border-color: var(--border-strong);
            outline: none;
        }

        .copy svg { width: 15px; height: 15px; }
        .copy.done { color: var(--online); border-color: oklch(0.8 0.15 150 / 0.4); }

        .credit {
            position: relative;
            z-index: 1;
            margin-top: 20px;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            color: var(--text-faint);
            text-decoration: none;
            transition: color 0.25s var(--ease);
        }

        .credit:hover { color: var(--text-dim); }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .reveal {
            opacity: 0;
            transform: translateY(18px);
            animation: reveal 0.8s var(--ease) forwards;
            animation-delay: calc(var(--i, 0) * 70ms + 120ms);
        }

        @keyframes reveal {
            to { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .reveal { opacity: 1; transform: none; }
            .particles { display: none; }
        }
    </style>
</head>

    <script>
        'use strict';
        (function () {
            const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

            (function particles() {
                if (reduced) return;
                const host = document.querySelector('.particles');
                if (!host) return;
                const symbols = ['✦', '◇', '✧', '⋆', '✶', '·'];
                const count = innerWidth <= 600 ? 9 : 16;
                const frag = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const p = document.createElement('span');
                    p.className = 'particle';
                    p.textContent = symbols[(Math.random() * symbols.length) | 0];
                    p.style.left = (Math.random() * 100).toFixed(2) + '%';
                    p.style.fontSize = (Math.random() * 10 + 10).toFixed(0) + 'px';
                    p.style.animationDuration = (Math.random() * 7 + 9).toFixed(1) + 's';
                    p.style.animationDelay = (-Math.random() * 16).toFixed(1) + 's';
                    frag.appendChild(p);
                }
                host.appendChild(frag);
            })();

            (function pointerGlow() {
                if (reduced || matchMedia('(pointer: coarse)').matches) return;
                const card = document.querySelector('.card');
                if (!card) return;
                card.addEventListener('pointermove', (e) => {
                    const r = card.getBoundingClientRect();
                    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
                    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
                });
            })();

            (function copyEmail() {
                const btn = document.querySelector('.copy');
                const live = document.getElementById('live');
                if (!btn) return;
                const okIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
                const original = btn.innerHTML;
                btn.addEventListener('click', async () => {
                    const email = btn.dataset.email;
                    try {
                        await navigator.clipboard.writeText(email);
                    } catch {
                        const t = document.createElement('textarea');
                        t.value = email; document.body.appendChild(t); t.select();
                        try { document.execCommand('copy'); } catch (_) {}
                        t.remove();
                    }
                    btn.classList.add('done');
                    btn.innerHTML = okIcon;
                    if (live) live.textContent = 'تم نسخ البريد الإلكتروني';
                    setTimeout(() => {
                        btn.classList.remove('done');
                        btn.innerHTML = original;
                    }, 1800);
                });
            })();

            const CONFIG = {
                analytics: {
                    enabled: true,
                    mode: 'proxy',                 
                    endpoint: 'https://twelve-analytics.grgrgrgor4.workers.dev/',
                    dedupeHours: 12,                
                    timeoutMs: 6000
                }
            };

            const MESSAGES = [
                '🖥️ الحياة تبدأ خارج منطقة الراحة. استمر في التعلم!',
                '🚀 أعظم الأكواد بدأت بفكرة بسيطة وكوب من القهوة ☕.',
                '💡 لا تخف من الأخطاء، فهي تثبت أنك تحاول بشكل صحيح.',
                '🕵️‍♂️ تم الاتصال بالنظام بنجاح. مرحباً بك في المتريكس!',
                '✨ سرّ الإبداع أن تُتقن التفاصيل الصغيرة.',
                '🎮 تذكّر: الكود الذي لا يحتوي على أخطاء هو كود لم يُكتب بعد!'
            ];

            (function analytics() {
                const cfg = CONFIG.analytics;
                if (!cfg.enabled || !cfg.endpoint || /\/XXXX\//.test(cfg.endpoint)) return;

                try {
                    const last = +localStorage.getItem('__tw_visit') || 0;
                    if (Date.now() - last < cfg.dedupeHours * 3600e3) return;
                    localStorage.setItem('__tw_visit', String(Date.now()));
                } catch (_) {  }

                const withTimeout = (ms) => {
                    const c = new AbortController();
                    setTimeout(() => c.abort(), ms);
                    return c.signal;
                };

                function detectEnv() {
                    const ua = navigator.userAgent;
                    const d = navigator.userAgentData;
                    let browser = 'غير معروف', os = 'غير معروف';

                    if (d && d.brands && d.brands.length) {
                        const b = d.brands.find(x => !/Not.?A.?Brand/i.test(x.brand));
                        browser = (b && b.brand) || browser;
                        os = d.platform || os;
                    } else {
                        if (/Edg\//.test(ua)) browser = 'Edge';
                        else if (/OPR\/|Opera/.test(ua)) browser = 'Opera';
                        else if (/Firefox\//.test(ua)) browser = 'Firefox';
                        else if (/Chrome\//.test(ua)) browser = 'Chrome';
                        else if (/Safari\//.test(ua)) browser = 'Safari';

                        if (/Windows/.test(ua)) os = 'Windows';
                        else if (/Android/.test(ua)) os = 'Android';
                        else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
                        else if (/Mac OS X/.test(ua)) os = 'macOS';
                        else if (/Linux/.test(ua)) os = 'Linux';
                    }

                    const type = (d && d.mobile) ? 'جوال'
                        : /iPad|Tablet/i.test(ua) ? 'لوحي'
                        : /Mobi|Android|iPhone/i.test(ua) ? 'جوال' : 'حاسوب';

                    return { browser, os, type };
                }

                async function fetchGeo() {
                    const providers = [
                        { url: 'https://ipapi.co/json/', map: d => ({ ip: d.ip, city: d.city, country: d.country_name, org: d.org }) },
                        { url: 'https://ipwho.is/', map: d => ({ ip: d.ip, city: d.city, country: d.country, org: d.connection && d.connection.isp }) }
                    ];
                    for (const p of providers) {
                        try {
                            const r = await fetch(p.url, { signal: withTimeout(cfg.timeoutMs) });
                            if (!r.ok) continue;
                            const m = p.map(await r.json());
                            if (m.ip) return m;
                        } catch (_) {  }
                    }
                    return {};
                }

                function post(url, payload) {
                    return fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        keepalive: true,
                        signal: withTimeout(cfg.timeoutMs)
                    });
                }

                (async function run() {
                    const env = detectEnv();
                    const nav = navigator;
                    const base = {
                        screen: screen.width + '×' + screen.height,
                        browser: env.browser,
                        os: env.os,
                        type: env.type,
                        lang: nav.language || 'غير متوفر',
                        referrer: document.referrer || 'مباشر',
                        connection: (nav.connection && nav.connection.effectiveType) || 'غير متوفر',
                        tz: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'غير متوفر'; } })(),
                        time: (() => { try { return new Date().toLocaleString('ar-SA', { hour12: true }); } catch { return new Date().toISOString(); } })(),
                        message: MESSAGES[(Math.random() * MESSAGES.length) | 0]
                    };

                    if (cfg.mode === 'proxy') {
                        try { await post(cfg.endpoint, base); } catch (_) {}
                        return;
                    }

                    const geo = await fetchGeo();
                    const g = v => '`' + (v || 'غير متوفر') + '`';
                    const location = (geo.city && geo.country) ? geo.city + '، ' + geo.country : 'غير متوفر';

                    const payload = {
                        username: 'مراقب الزوار | Twelve',
                        avatar_url: 'https://i.postimg.cc/FRcSHZ7B/twelve-avtar-2.jpg',
                        embeds: [
                            {
                                title: '👁️ زائر جديد في الموقع',
                                color: 8421504,
                                description:
                                    '**🌐 IP:** ' + g(geo.ip) + '\n' +
                                    '**📍 الموقع:** ' + g(location) + '\n' +
                                    '**🏢 المزوّد:** ' + g(geo.org) + '\n' +
                                    '**💻 الجهاز:** ' + g(base.type + ' · ' + base.os) + '\n' +
                                    '**🧭 المتصفح:** ' + g(base.browser) + '\n' +
                                    '**📶 الاتصال:** ' + g(base.connection) + '\n' +
                                    '**📱 الشاشة:** ' + g(base.screen) + '\n' +
                                    '**🗣️ اللغة:** ' + g(base.lang) + '\n' +
                                    '**↩️ المصدر:** ' + g(base.referrer) + '\n' +
                                    '**⏱️ الوقت:** ' + g(base.time),
                                timestamp: new Date().toISOString()
                            },
                            {
                                title: '💬 رسالة النظام',
                                description: '**"' + base.message + '"**',
                                color: 3092790
                            }
                        ]
                    };

                    try { await post(cfg.endpoint, payload); } catch (_) {}
                })();
            })();
        })();
    </script>
